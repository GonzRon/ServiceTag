[project]
name = "servicetag-schedules"
version = "0.1.0"
description = "Plans and applies a maintenance-schedule manifest onto a phone through the automation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "servicetag-mcp",
    "mcp>=2.2,<3",
]

[tool.uv.sources]
servicetag-mcp = { path = "../servicetag-mcp" }

[project.scripts]
servicetag-schedules = "servicetag_schedules.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicetag_schedules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
