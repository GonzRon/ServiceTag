name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: assert the shared library is initialised at the pinned tag
        run: bash tools/check-submodule-pin.sh
      - name: unit tests and debug build
        run: ./gradlew :nfc-core:test :nfc-android:testDebugUnitTest :core:test :app:testDebugUnitTest :app:assembleDebug :share-test-sender:assembleDebug --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: |
            libs/nfc-tag-core/nfc-core/build/test-results
            libs/nfc-tag-core/nfc-android/build/test-results
            core/build/test-results
            app/build/test-results
  mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false            # this job needs no git credentials after the checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "tools/servicetag-mcp/uv.lock"
      - name: the workstation MCP server's tests
        run: uv run --frozen pytest
        working-directory: tools/servicetag-mcp
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false            # this job needs no git credentials after the checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "tools/servicetag-bundle/uv.lock"
      - name: the Stage-A bundle tool's tests
        run: uv run --frozen pytest
        working-directory: tools/servicetag-bundle
  schedules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false            # this job needs no git credentials after the checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "tools/servicetag-schedules/uv.lock"
      - name: the Stage-B schedules loader's tests
        run: uv run --frozen pytest
        working-directory: tools/servicetag-schedules
